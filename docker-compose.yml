services:
  postgres:
    image: postgres:16-alpine
    container_name: huflit_translation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: huflit_user
      POSTGRES_PASSWORD: huflit_password
      POSTGRES_DB: huflit_translation_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: huflit_translation_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
